services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8000

  postgres:
    image: postgres:17-alpine
    container_name: vwdp-postgres
    environment:
      POSTGRES_DB: vwdp
      POSTGRES_USER: vwdp
      POSTGRES_PASSWORD: ${VWDP_POSTGRES_PASSWORD:?Set VWDP_POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - vwdp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vwdp -d vwdp"]
      interval: 5s
      timeout: 5s
      retries: 10

  metabase-db:
    image: postgres:17-alpine
    container_name: vwdp-metabase-db
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${METABASE_DB_PASSWORD:?Set METABASE_DB_PASSWORD}
    volumes:
      - metabase_app_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 5s
      timeout: 5s
      retries: 20

  metabase:
    image: metabase/metabase:v0.63.1
    container_name: vwdp-metabase
    depends_on:
      postgres:
        condition: service_healthy
      metabase-db:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD:?Set METABASE_DB_PASSWORD}
      MB_DB_HOST: metabase-db
      MB_SITE_URL: ${METABASE_SITE_URL:-http://localhost:3000}
      MB_SITE_NAME: VWDP Metabase
      MB_ANON_TRACKING_ENABLED: "false"
      MB_ENABLE_PUBLIC_SHARING: "true"
      MB_ENCRYPTION_SECRET_KEY: ${METABASE_ENCRYPTION_SECRET_KEY:?Set METABASE_ENCRYPTION_SECRET_KEY}
      JAVA_TIMEZONE: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40

  metabase-public-gateway:
    image: nginx:1.29-alpine
    container_name: vwdp-metabase-public
    depends_on:
      metabase:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:80"
    volumes:
      - ./config/metabase-public-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  vwdp_postgres_data:
  metabase_app_data:
